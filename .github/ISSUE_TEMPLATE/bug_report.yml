name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here — use [private reporting](https://github.com/Solve4x-ai/Keyturn/security/advisories/new).
        **Never paste** client IDs, secrets, tokens, tenant names, hostnames, or IPs. Reproduce with `npm run demo` if you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run demo
        2. Open Infrastructure → DHCP
        3. ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Keyturn dashboard, MCP tools / AI client, Setup / auth, Runbooks / PowerShell runner, Demo, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.5.0 or abc1234
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Node 22.13, Claude Desktop
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact anything tenant-specific first.
